# PLACEHOLDER — invented values, pending Aguado's clinical parameters.
# Every physiological and technical number below is made up so the simulator runs end to end; none of
# them is a clinical reference. Every numeric field is mandatory (the code has no defaults).
# Write exponents as 1.0e-3 (PyYAML reads 1e-3 as text) and quote times of day ("07:00").

seed: 20261113
start_date: 2026-11-01
start_mission_day: -3          # mission_day of the first simulated day (L-3); launch day = 0

segments:
  - { days: 3, phase: preflight, gravity_environment: earth_1g }
  - { days: 8, phase: inflight, gravity_environment: microgravity }
  - { days: 3, phase: postflight, gravity_environment: earth_1g }

crew:
  - astronaut_id: AST-01
    device_id: sim-01
    latent_multipliers: { spine_elongation: 1.0, muscle_deconditioning: 1.0, rom_motor_control: 1.0, pain_stiffness: 1.0 }
    exercise_adherence: 1.0
    baseline:
      cord_rest_length_mm: 400.0
      emg_mvc_rms_mv: { emg_lat_left: 1.85, emg_lat_right: 1.80 }
    profile:
      date_of_birth: 1988-04-12
      sex_at_birth: female
      anthropometry: { height_standing_cm: 172, height_sitting_cm: 90, body_mass_kg: 68 }
      spine_history:
        low_back_pain_history: true
        disc_herniation: { has_history: false }
        notes: Fictional profile for the simulator.
      space_history: { previous_missions: 1, cumulative_microgravity_days: 186 }
      fitness: { dominant_side: right, training_level: high, lat_pulldown_reference_load_kg: 45 }
  - astronaut_id: AST-02
    device_id: sim-02
    latent_multipliers: { spine_elongation: 1.2, muscle_deconditioning: 1.3, rom_motor_control: 0.9, pain_stiffness: 1.5 }
    exercise_adherence: 0.8
    baseline:
      cord_rest_length_mm: 410.0
      emg_mvc_rms_mv: { emg_lat_left: 2.10, emg_lat_right: 2.25 }
    profile:
      date_of_birth: 1981-09-30
      sex_at_birth: male
      anthropometry: { height_standing_cm: 181, body_mass_kg: 82 }
      space_history: { previous_missions: 0 }
      fitness: { dominant_side: left, training_level: moderate }

device:
  firmware_version: sim-0.1.0
  link_type: simulated
  rssi_dbm: null
  power_on_time_utc: "06:30"
  power_off_time_utc: "22:30"
  battery:
    start_pct: 100.0
    drain_pct_per_hour_streaming: 6.0
    drain_pct_per_hour_idle: 1.5
    degraded_below_pct: 20.0
  temperature_c: { mean: 31.0, sd: 0.8 }
  status_interval_s: 30.0
  clock_sync_interval_s: 60.0
  streams:
    - stream_id: emg_lat_left
      stream_kind: emg
      placement: { muscle: latissimus_dorsi, side: left }
    - stream_id: emg_lat_right
      stream_kind: emg
      placement: { muscle: latissimus_dorsi, side: right }
    - stream_id: imu_l3
      stream_kind: imu
      placement: { spine_level: l3 }
    - stream_id: stretch_lumbar
      stream_kind: stretch
      placement: { spine_region: lumbar, span: { from_level: l1, to_level: l5 } }

protocols:
  lat_pulldown_standing_v1:
    session_type: exercise
    streams: [emg_lat_left, emg_lat_right, imu_l3, stretch_lumbar]
    lead_in_s: 10.0
    planned_reps: 10
    rep_duration_s: 4.0
    rest_between_reps_s: 4.0
    lead_out_s: 120.0
    pct_mvc: 45.0
    rom_deg: 30.0
    plane: sagittal
    load:
      type: elastic_band
      nominal_kg: 15.0
      band_stretch_cm: 40.0
      band_id: blue
  spine_length_rest_v1:
    session_type: spine_check
    streams: [imu_l3, stretch_lumbar]
    duration_s: 120.0

schedule:
  sessions:
    - { name: am_spine_check, protocol_id: spine_length_rest_v1, time_utc: "07:00", start_jitter_s: 300.0, phases: [preflight, inflight, postflight], every_n_days: 1 }
    - { name: lat_pulldown, protocol_id: lat_pulldown_standing_v1, time_utc: "10:00", start_jitter_s: 600.0, phases: [preflight, inflight, postflight], every_n_days: 1 }
    - { name: pm_spine_check, protocol_id: spine_length_rest_v1, time_utc: "21:30", start_jitter_s: 300.0, phases: [preflight, inflight, postflight], every_n_days: 1 }
  background:
    enabled: true
    name: background
    protocol_id: background_monitoring_v1
    # Short window around the exercise session so the pause/resume is visible without huge outputs
    # (at 100 ms per chunk, every background hour is 36 000 chunks per stream).
    start_time_utc: "09:30"
    end_time_utc: "10:30"
    streams: [imu_l3, stretch_lumbar]
    sample_rates_hz: { imu: 10.0, stretch: 10.0 }
    bends_per_hour: 6.0
    bend_rom_deg: 20.0
    bend_duration_s: 3.0

calibration:
  stretch:
    every_n_days: 7
    recovery_wait_s: 120.0
    measurement_noise_mm: 0.5
    n_points: 4
    temperature_c: 22.5
  emg_mvc:
    window_ms: 250
    n_trials: 3
    measurement_noise_rel: 0.05
  imu:
    every_n_days: 7
    static_duration_s: 10.0
    gyro_bias_noise_dps: 0.05
    accel_bias_noise_g: 0.002

curves:
  # x = mission_day (launch = 0, landing = 8 here). spine_elongation in mm over the preflight rest
  # length; the other three are 0..1 indices. Typical trajectory WITH the planned exercise.
  spine_elongation:
    points: [ { mission_day: 0, value: 0.0 }, { mission_day: 3, value: 8.0 }, { mission_day: 7, value: 10.0 }, { mission_day: 8, value: 2.0 }, { mission_day: 10, value: 0.0 } ]
    daily_sd: 0.5
    dose_drift_per_day: 0.2
  muscle_deconditioning:
    points: [ { mission_day: 0, value: 0.0 }, { mission_day: 7, value: 0.25 }, { mission_day: 10, value: 0.15 } ]
    daily_sd: 0.01
    dose_drift_per_day: 0.01
  rom_motor_control:
    points: [ { mission_day: 0, value: 0.0 }, { mission_day: 4, value: 0.1 }, { mission_day: 7, value: 0.15 }, { mission_day: 10, value: 0.05 } ]
    daily_sd: 0.01
    dose_drift_per_day: 0.005
  pain_stiffness:
    points: [ { mission_day: -1, value: 0.05 }, { mission_day: 2, value: 0.4 }, { mission_day: 7, value: 0.15 }, { mission_day: 8, value: 0.35 }, { mission_day: 10, value: 0.1 } ]
    daily_sd: 0.03
    dose_drift_per_day: 0.01

signals:
  chunk_ms: 100
  emg:
    sample_rate_hz: 1000.0
    band_low_hz: 20.0
    band_high_hz: 450.0
    filter_order: 4
    noise_rms_mv: 0.01
    rest_pct_mvc: 2.0
    fatigue_per_rep: 0.03
    fatigue_band_shift: 0.3
    deconditioning_pct_mvc_gain: 0.5
    deconditioning_fatigue_gain: 1.0
    acquisition: { adc_bits: 12, vref_v: 3.3, gain: 1000.0, input_pin: GPIO34 }
    filter: { highpass_hz: 20.0, lowpass_hz: 450.0, notch_hz: 50 }
  imu:
    sample_rate_hz: 100.0
    accel_noise_g: 0.004
    gyro_noise_dps: 0.05
    accel_bias_g: { x: 0.01, y: -0.005, z: 0.002 }
    gyro_bias_dps: { x: 0.3, y: -0.2, z: 0.1 }
    accel_range_g: 4
    gyro_range_dps: 500
    dlpf_hz: 44.0
    mounting: { sensor_x: cranial, sensor_y: left, sensor_z: posterior }
    lever_arm_m: 0.25
    rom_loss_gain: 1.0
    pain_rom_gain: 0.5
    tremor_dps_per_unit: 4.0
  stretch:
    sample_rate_hz: 20.0
    curve:
      - { resistance_ohm: 5400.0, length_mm: 360.0 }
      - { resistance_ohm: 6012.0, length_mm: 400.0 }
      - { resistance_ohm: 6790.0, length_mm: 450.0 }
      - { resistance_ohm: 7560.0, length_mm: 500.0 }
    circuit: { adc_bits: 12, vref_v: 3.3, series_resistor_ohm: 10000.0, input_pin: GPIO35 }
    adc_noise_counts: 1.5
    hysteresis_tau_s: 90.0
    hysteresis_gain: 0.15
    band_recovering_threshold_mm: 0.5
    band_recovering_score: 0.8
    flexion_mm_per_deg: 0.6
    elongation_coupling: 1.0
    diurnal_loss_mm_at_1g: 3.0

faults:
  quality:
    clipping:           { probability: 0.0005, duration_ms: { min: 100.0, max: 500.0 }, score: 0.4, amplitude: 0.6, kinds: [emg, imu] }
    lead_off:           { probability: 0.0002, duration_ms: { min: 500.0, max: 3000.0 }, score: 0.0, amplitude: 3.0, kinds: [emg] }
    motion_artifact:    { probability: 0.001, duration_ms: { min: 200.0, max: 800.0 }, score: 0.5, amplitude: 2.0, kinds: [emg, imu] }
    powerline_noise:    { probability: 0.0005, duration_ms: { min: 1000.0, max: 5000.0 }, score: 0.6, amplitude: 0.5, kinds: [emg], frequency_hz: 50 }
    low_snr:            { probability: 0.0005, duration_ms: { min: 1000.0, max: 4000.0 }, score: 0.6, amplitude: 1.0, kinds: [emg, imu, stretch] }
    saturated_adc:      { probability: 0.0002, duration_ms: { min: 100.0, max: 400.0 }, score: 0.0, amplitude: 1.0, kinds: [stretch] }
    out_of_calibration: { probability: 0.0001, duration_ms: { min: 5000.0, max: 20000.0 }, score: 0.5, amplitude: 1.0, kinds: [stretch] }
    sensor_warmup:      { probability: 0.0002, duration_ms: { min: 2000.0, max: 8000.0 }, score: 0.7, amplitude: 0.5, kinds: [imu, stretch] }
  device:
    packet_loss:
      probability: 0.002
      burst_chunks: { min: 1, max: 5 }
      stalled_after_chunks: 3
      packet_gap_score: 0.7
    reboot:
      probability_per_hour: 0.02
      offline_s: { min: 5.0, max: 30.0 }
    clock:
      latency_ms: { min: 15.0, max: 60.0 }
      drift_ppm: { min: -40.0, max: 40.0 }
      sync_uncertainty_ms: { min: 5.0, max: 25.0 }
      uncertain_threshold_ms: 50.0
      clock_uncertain_score: 0.8

daily_context:
  exercise:
    preflight:
      - { modality: other, planned_min: 45.0, sd_min: 10.0, skip_probability: 0.1, load_kg: null, rpe: 5 }
    inflight:
      - { modality: ared, planned_min: 60.0, sd_min: 10.0, skip_probability: 0.05, load_kg: 60.0, rpe: 6 }
      - { modality: cevis, planned_min: 30.0, sd_min: 5.0, skip_probability: 0.1, load_kg: null, rpe: 5 }
      - { modality: t2, planned_min: 30.0, sd_min: 5.0, skip_probability: 0.1, load_kg: null, rpe: 6 }
    postflight:
      - { modality: other, planned_min: 30.0, sd_min: 10.0, skip_probability: 0.2, load_kg: null, rpe: 4 }
  countermeasures:
    preflight: []
    inflight:
      - { type: stretching, planned_min: 15.0, sd_min: 5.0, skip_probability: 0.2 }
    postflight:
      - { type: stretching, planned_min: 20.0, sd_min: 5.0, skip_probability: 0.1 }
  medication:
    - { name: paracetamol, category: analgesic, dose_mg: 500.0, pain_threshold: 0.35, probability: 0.6, time_utc: "08:00" }

self_report:
  time_utc: "21:45"
  time_jitter_s: 600.0
  pain_nrs_per_unit: 10.0
  stiffness_nrs_per_unit: 8.0
  nrs_noise_sd: 0.7
  worst_24h_extra_nrs: { min: 0, max: 2 }
  pain_location_min_nrs: 2
  pain_locations:
    - { region: lumbar, side: midline }
  sleep_hours: { mean: 7.0, sd: 0.6 }
  sleep_quality_nrs: { mean: 7.0, sd: 1.0 }
  sleep_pain_penalty_h_per_nrs: 0.15
  red_flag_probability_per_day: 0.0
  red_flags: []
