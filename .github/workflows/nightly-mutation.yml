name: nightly-mutation

permissions:
  contents: read

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  mutation:
    runs-on: ubuntu-latest
    # A full physiology run takes about 2.5 h; 360 min is the GitHub-hosted maximum.
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - name: Full mutation report (non blocking)
        env:
          GATE_MUTATION: full
        run: |
          docker compose -f app/docker-compose.yml run --rm -T quality 2>&1 | tee mutation-output.log
      - name: Summary
        if: always()
        run: |
          { echo '### Full mutation report (tail)'; echo '```'; tail -n 60 mutation-output.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
