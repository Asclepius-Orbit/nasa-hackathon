services:
  mosquitto:
    image: eclipse-mosquitto:2.0.22
    ports:
      - "127.0.0.1:1883:1883"
    volumes:
      - ./mosquitto/config:/mosquitto/config
      - ./mosquitto/data:/mosquitto/data
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -h 127.0.0.1 -p 1883 -t '$$SYS/broker/uptime' -C 1 -W 3 > /dev/null"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  engine:
    build:
      context: ..
      dockerfile: spine_monitor/engine/Dockerfile
    image: spine-engine:dev
    ports:
      - "127.0.0.1:8001:8001"
    restart: unless-stopped

  backend:
    build:
      context: ..
      dockerfile: spine_monitor/backend/Dockerfile
    image: spine-backend:dev
    environment:
      MQTT_HOST: mosquitto
      MQTT_PORT: "1883"
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      mosquitto:
        condition: service_healthy
    restart: unless-stopped

  simulator:
    build:
      context: ..
      dockerfile: spine_monitor/physiology/Dockerfile
    image: spine-simulator:dev
    environment:
      SPINE_SIM_CONFIG: /app/configs/example-mission.yaml
      SPINE_SIM_MQTT_HOST: mosquitto
      SPINE_SIM_MQTT_PORT: "1883"
      SPINE_SIM_SPEED: "1"
      SPINE_SIM_START_DAY: "0"
    depends_on:
      mosquitto:
        condition: service_healthy
    profiles: ["sim"]
    restart: unless-stopped

  quality:
    build:
      context: ..
      dockerfile: spine_monitor/quality/Dockerfile
    image: spine-quality:dev
    # Shares mosquitto's network namespace so the tests' 127.0.0.1:1883 reaches the broker.
    network_mode: "service:mosquitto"
    depends_on:
      mosquitto:
        condition: service_healthy
    volumes:
      - ../spine_monitor:/work/spine_monitor
    environment:
      GATE_MUTATION: "${GATE_MUTATION:-off}"
    profiles: ["quality"]
