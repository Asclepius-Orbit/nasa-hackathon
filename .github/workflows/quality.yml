name: quality

permissions:
  contents: read

on:
  pull_request:
    branches: [develop]

concurrency:
  group: quality-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Broker credentials (throwaway, generated per run; app/.env and app/mosquitto/auth are gitignored)
        run: sh app/mosquitto/setup.sh
      - name: Quality gate (lint, types, tests, coverage)
        env:
          GATE_MUTATION: "off"
        run: docker compose -f app/docker-compose.yml run --rm -T quality
      - name: Diff coverage
        # Runs in the quality image (diff-cover is in the locked dev group); the WORKDIR spine_monitor/ makes coverage.xml paths map to git paths.
        env:
          BASE_REF: ${{ github.base_ref }}
        run: >
          docker compose -f app/docker-compose.yml run --rm -T -e BASE_REF quality
          sh -c 'git config --global --add safe.directory "*" && diff-cover coverage.xml --compare-branch="origin/$BASE_REF" --fail-under=90'

  mutation:
    runs-on: ubuntu-latest
    # Incremental mutation scales with the changed functions. A branch-wide diff selecting 1541 mutants took about
    # 15 min on a 22-CPU machine (measured); on a 2-vCPU hosted runner that is only an ESTIMATE (extrapolated, not
    # measured) of about 2 h. 240 min leaves margin over that estimate.
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Broker credentials (throwaway, generated per run; app/.env and app/mosquitto/auth are gitignored)
        run: sh app/mosquitto/setup.sh
      - name: Incremental mutation
        env:
          MUTATION_BASE: origin/${{ github.base_ref }}
        run: docker compose -f app/docker-compose.yml run --rm -T quality sh quality/mutation.sh changed

  gate:
    # Preserve the existing required check while running its two independent parts on separate runners.
    if: always()
    needs: [tests, mutation]
    runs-on: ubuntu-latest
    steps:
      - name: Require tests and mutation
        env:
          TESTS_RESULT: ${{ needs.tests.result }}
          MUTATION_RESULT: ${{ needs.mutation.result }}
        run: test "$TESTS_RESULT" = success && test "$MUTATION_RESULT" = success

  ui-quality:
    # Native (not compose): the bind-mounted repo is owned by the runner uid, which the image's non-root user cannot write.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: app/ui
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Enable corepack (pnpm version comes from package.json packageManager)
        run: corepack enable
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: UI quality gate (lint, types, contract types, tests+coverage, audit)
        run: pnpm check
