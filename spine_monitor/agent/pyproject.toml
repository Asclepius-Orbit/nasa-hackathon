[project]
name = "spine-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Oriol Orbea", email = "oriol.orbea@gmail.com" }
]
requires-python = ">=3.14.8,<3.15"
dependencies = [
    "fastapi>=0.162.0",
    "mcp>=2.3.0",
    "pydantic-ai-slim[mcp,openai]>=2.66.0",
    "pydantic-settings>=2.16.1",
    "spine-contracts",
    "spine-mcp-server",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
spine-agent = "spine_agent:main"
spine-agent-http = "spine_agent.http:main"

[build-system]
requires = ["uv_build>=0.11.20,<0.12.0"]
build-backend = "uv_build"

[tool.uv.sources]
spine-contracts = { workspace = true }
spine-mcp-server = { workspace = true }
