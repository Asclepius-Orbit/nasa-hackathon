openapi: 3.1.0
info:
  title: Spine app UI view API
  version: 1.0.0
  license:
    name: GNU General Public License v3.0
  description: |
    Local HTTP API of the on-board app that backs the desktop UI. Each view endpoint returns one
    screen already chewed: the backend computes the view from the stored assessments, sessions,
    self-reports, baseline, device status and the protocol catalog (`catalog/protocol-catalog.json`).
    Views are only GET. The UI posts the astronaut's actions: starting, stopping and marking a session, self-reports
    and contacts with the crew medical officer. The crew data the UI keeps up to date is read and written whole with GET and PUT:
    the astronaut profile and the daily context (`schemas/v1/domain/`). The UI also lists the devices that
    published a status for the astronaut, to pair a harness.

    Every request carries `Authorization: Bearer <token>` (the shared UI token) and `X-Astronaut-Id` (the
    unlocked astronaut): 401 without a valid token, 403 when the header names another astronaut.

    Views carry codes and data, never prose: recommendation codes (`REC_*`), task codes (`TASK_*`),
    feature ids, missing reasons, red-flag codes and protocol fit-item ids. The UI writes the words.
    Missing data is an explicit `null` or level `nodata`, never a default. The crew views answer 200 with
    `nodata`/nulls for an astronaut without data (there is no 404 for them: an astronaut id with no data
    is not an error); only the session view answers 404, for an unknown session.

    Response bodies are the JSON Schemas in `schemas/v1/app/ui-*.schema.json`, which are the source of
    truth. Errors are RFC 9457 problem details with the same `app/error` schema as the read-only API
    (`app-openapi.yaml`). Served by the same local app process, on localhost only.
security: []
servers:
  - url: http://127.0.0.1:8000
    description: Local app process (write and view API, /ui)
paths:
  /ui/crew:
    get:
      operationId: listCrew
      summary: Crew known to the backend
      description: Astronaut ids registered by the UI or with data stored, with whether each has a profile and a baseline and how many sessions. Ids and flags only, never names or PINs (they stay in the UI). Empty `crew` when nothing is known.
      responses:
        '200':
          description: The crew list.
          content:
            application/json:
              schema:
                $ref: 'schemas/v1/app/ui-crew.schema.json'
        '422':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /ui/crew/{astronaut_id}/contacts:
    get:
      operationId: listMedicalContacts
      summary: Medical contacts of an astronaut
      description: Calls to the crew medical officer logged for the astronaut, oldest first (written with POST on the same path). Empty `contacts` for an astronaut without any.
      parameters:
        - $ref: '#/components/parameters/AstronautId'
      responses:
        '200':
          description: The contact list.
          content:
            application/json:
              schema:
                $ref: 'schemas/v1/app/ui-contact-list.schema.json'
        '422':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
    post:
      operationId: logMedicalContact
      summary: Log a contact with the crew medical officer
      description: >-
        `contact_id` and `at` default to the app's; `astronaut_id` comes from the path. The contact reaches the ground
        in the day's summary. Repeating a `contact_id` with the same content answers 200; with other content 409.
      parameters:
        - $ref: '#/components/parameters/AstronautId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: 'schemas/v1/domain/medical-contact.schema.json'
      responses:
        '201':
          description: The stored contact.
          content:
            application/json:
              schema:
                $ref: 'schemas/v1/domain/medical-contact.schema.json'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Invalid'
        default:
          $ref: '#/components/responses/Error'
  /ui/crew/{astronaut_id}/profile:
    get:
      operationId: getProfile
      summary: Profile of an astronaut
      description: The stored profile (anthropometry, launch and landing dates...). No names. 404 until one is stored.
      parameters:
        - $ref: '#/components/parameters/AstronautId'
      responses:
        '200':
          description: The stored data.
          headers:
            ETag:
              description: Opaque version for a conditional update.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: 'schemas/v1/domain/astronaut-profile.schema.json'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NoData'
        '422':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
    put:
      operationId: putProfile
      summary: Store the profile of an astronaut
      description: Replaces the whole profile. `schema_version` and `updated_at` default to the app's; `astronaut_id` comes from the path (a different one in the body is a 422). The assessment is redone.
      parameters:
        - $ref: '#/components/parameters/AstronautId'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/IfNoneMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: 'schemas/v1/domain/astronaut-profile.schema.json'
      responses:
        '200':
          description: The stored data.
          content:
            application/json:
              schema:
                $ref: 'schemas/v1/domain/astronaut-profile.schema.json'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '412':
          $ref: '#/components/responses/AlreadyStored'
        '422':
          $ref: '#/components/responses/Invalid'
        default:
          $ref: '#/components/responses/Error'
  /ui/crew/{astronaut_id}/daily-context/{day}:
    get:
      operationId: getDailyContext
      summary: Daily context of an astronaut on a day
      description: Phase, gravity environment, mission day, medication, exercise and countermeasures of the day. 404 until one is stored.
      parameters:
        - $ref: '#/components/parameters/AstronautId'
        - $ref: '#/components/parameters/Day'
      responses:
        '200':
          description: The stored data.
          headers:
            ETag:
              description: Opaque version for a conditional update.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: 'schemas/v1/domain/daily-context.schema.json'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NoData'
        '422':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
    put:
      operationId: putDailyContext
      summary: Store the daily context of an astronaut on a day
      description: |
        Replaces the context of that day. `astronaut_id` and `date` come from the path (different ones in the body are a 422).
        An `If-Match` ETag makes replacement conditional on the version read (412 if changed).
        Starting a session needs today's context; the assessment is redone.
        With `If-None-Match: *` it only creates it, in one atomic step: when a context is already stored for that day the
        answer is 412, the stored one is left as it was and nothing is reassessed.
      parameters:
        - $ref: '#/components/parameters/AstronautId'
        - $ref: '#/components/parameters/Day'
        - $ref: '#/components/parameters/IfNoneMatch'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: 'schemas/v1/domain/daily-context.schema.json'
      responses:
        '200':
          description: The stored data.
          content:
            application/json:
              schema:
                $ref: 'schemas/v1/domain/daily-context.schema.json'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '412':
          $ref: '#/components/responses/AlreadyStored'
        '422':
          $ref: '#/components/responses/Invalid'
        default:
          $ref: '#/components/responses/Error'
  /ui/crew/{astronaut_id}/devices:
    get:
      operationId: listDevices
      summary: Devices seen for an astronaut
      description: The last status each device published on the bus for the astronaut (`asclepius/v1/crew/{astronaut_id}/device/{device_id}/status`), ordered by `device_id`. Empty when none has been seen. Used to pair a harness; the pairing itself stays in the UI.
      parameters:
        - $ref: '#/components/parameters/AstronautId'
      responses:
        '200':
          description: The device statuses.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: 'schemas/v1/telemetry/device-status.schema.json'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /ui/crew/{astronaut_id}/sessions:
    post:
      operationId: startSession
      summary: Start a session on the astronaut's harness
      description: >-
        The body is a `domain/session` without the fields the app sets (`session_id`, `started_at`, `ended_at`,
        `end_reason`, `events`: sending one is a 422), plus an optional positive `max_duration_s` that only goes in the
        command. `device_id` is required; `mission_context` defaults to today's daily context (none stored is a 422).
        The command goes to the harness at once; the session stays `starting` until it acks, then `running`, or
        `rejected` (also on ack timeout). Follow it with the session view.
      parameters:
        - $ref: '#/components/parameters/AstronautId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: 'schemas/v1/domain/session.schema.json'
      responses:
        '202':
          description: The session and the start command sent.
          content:
            application/json:
              schema:
                type: object
                required: [session, state, command]
                properties:
                  session:
                    $ref: 'schemas/v1/domain/session.schema.json'
                  state:
                    const: starting
                  command:
                    $ref: 'schemas/v1/telemetry/command.schema.json'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/Invalid'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/BusDown'
        default:
          $ref: '#/components/responses/Error'
  /ui/crew/{astronaut_id}/self-reports:
    post:
      operationId: postSelfReport
      summary: Store a self-report (daily, weekly ODI or red flag)
      description: >-
        `report_id`, `timestamp`, `source` (`device`) and `mission_day` (from today's daily context) default to the
        app's; `astronaut_id` comes from the path. The assessment is redone at once and comes back with the report
        (`null` with the reason in `assessment_skipped`). A report with red flags or other symptoms reaches the ground
        even when no assessment is made. Repeating a `report_id` with the same content answers 200 with
        `assessment_skipped` `duplicate`; with other content 409.
      parameters:
        - $ref: '#/components/parameters/AstronautId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: 'schemas/v1/domain/self-report.schema.json'
      responses:
        '201':
          description: The stored report and the assessment it led to.
          content:
            application/json:
              schema:
                type: object
                required: [report, assessment, assessment_skipped]
                properties:
                  report:
                    $ref: 'schemas/v1/domain/self-report.schema.json'
                  assessment:
                    oneOf:
                      - $ref: 'schemas/v1/domain/assessment.schema.json'
                      - type: 'null'
                  assessment_skipped:
                    type: [string, 'null']
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Invalid'
        default:
          $ref: '#/components/responses/Error'
  /ui/crew/{astronaut_id}/self-reports/due:
    get:
      operationId: getReportsDue
      summary: Which self-reports are due today
      description: Whether today's daily report and this week's ODI are still due, and when the last ones were made.
      parameters:
        - $ref: '#/components/parameters/AstronautId'
      responses:
        '200':
          description: What is due.
          content:
            application/json:
              schema:
                type: object
                required: [date, daily_due, weekly_odi_due, red_flag_available, last_daily_at, last_weekly_odi_at]
                properties:
                  date:
                    $ref: 'schemas/v1/common.schema.json#/$defs/date'
                  daily_due:
                    type: boolean
                  weekly_odi_due:
                    type: boolean
                  red_flag_available:
                    type: boolean
                  last_daily_at:
                    oneOf:
                      - $ref: 'schemas/v1/common.schema.json#/$defs/utc_timestamp'
                      - type: 'null'
                  last_weekly_odi_at:
                    oneOf:
                      - $ref: 'schemas/v1/common.schema.json#/$defs/utc_timestamp'
                      - type: 'null'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /ui/sessions/{session_id}/stop:
    post:
      operationId: stopSession
      summary: Stop a running session
      description: >-
        `reason` is `completed` (default), `aborted_by_user`, `aborted_pain` or `aborted_other`; `rep_index` (from 1) only
        with `aborted_pain`. A stop for pain is stored as a `pain_reported` event before the command is sent, so it
        reaches the ground and the assessment even when the bus is down (503).
      parameters:
        - $ref: '#/components/parameters/SessionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                reason:
                  enum: [completed, aborted_by_user, aborted_pain, aborted_other]
                rep_index:
                  type: integer
                  minimum: 1
      responses:
        '202':
          description: The stop command sent.
          content:
            application/json:
              schema:
                type: object
                required: [command]
                properties:
                  command:
                    $ref: 'schemas/v1/telemetry/command.schema.json'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Invalid'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/BusDown'
        default:
          $ref: '#/components/responses/Error'
  /ui/sessions/{session_id}/events:
    post:
      operationId: markSessionEvent
      summary: Mark an event in a running session
      description: An event of the session (e.g. `artifact` at a repetition), sent to the harness so it lands on its clock.
      parameters:
        - $ref: '#/components/parameters/SessionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [event_type]
              properties:
                event_type:
                  enum: [rep_start, rep_end, mvc_start, mvc_end, rest_start, rest_end, pain_reported, artifact, note]
                rep_index:
                  type: integer
                  minimum: 1
                note:
                  type: string
                  maxLength: 200
      responses:
        '202':
          description: The event command sent.
          content:
            application/json:
              schema:
                type: object
                required: [command]
                properties:
                  command:
                    $ref: 'schemas/v1/telemetry/command.schema.json'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Invalid'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/BusDown'
        default:
          $ref: '#/components/responses/Error'
  /ui/sessions/{session_id}/calibrations:
    post:
      operationId: calibrateSession
      summary: Calibrate streams of a running session
      description: '`stream_ids` must be streams declared in the session (otherwise 422). The session view shows when the harness acked it.'
      parameters:
        - $ref: '#/components/parameters/SessionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [calibration_type, stream_ids]
              properties:
                calibration_type:
                  enum: [stretch, emg_mvc, imu]
                stream_ids:
                  type: array
                  minItems: 1
                  items:
                    type: string
                duration_s:
                  type: number
                  exclusiveMinimum: 0
      responses:
        '202':
          description: The calibration command sent.
          content:
            application/json:
              schema:
                type: object
                required: [command]
                properties:
                  command:
                    $ref: 'schemas/v1/telemetry/command.schema.json'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Invalid'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/BusDown'
        default:
          $ref: '#/components/responses/Error'
  /ui/sessions/{session_id}/reprocess:
    post:
      operationId: reprocessSession
      summary: Analyse again a session whose analysis failed for good
      description: Only a `processing_failed` session (otherwise 409); it goes back to `ended` and the analysis runs in the background.
      parameters:
        - $ref: '#/components/parameters/SessionId'
      responses:
        '202':
          description: The session is queued for analysis.
          content:
            application/json:
              schema:
                type: object
                required: [session, state]
                properties:
                  session:
                    $ref: 'schemas/v1/common.schema.json#/$defs/uuid'
                  state:
                    const: ended
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /ui/crew/{astronaut_id}/views/strip:
    get:
      operationId: getStripView
      summary: Always-visible strip
      description: Mission day and phase, paired harness, ground link and reports still due today. Without `device_id` the harness is the astronaut's device with the latest status (null when none, or when it is offline). With `device_id` the harness describes that device, whatever the others report, from its last status (`stale` and offline computed as without it), or null when that device has never reported for the astronaut. A `device_id` that is not a device id is a 422.
      parameters:
        - $ref: '#/components/parameters/AstronautId'
        - $ref: '#/components/parameters/DeviceId'
      responses:
        '200':
          description: The strip view.
          content:
            application/json:
              schema:
                $ref: 'schemas/v1/app/ui-strip.schema.json'
        '422':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /ui/crew/{astronaut_id}/views/today:
    get:
      operationId: getTodayView
      summary: Today screen
      description: Level, reasons, recommendations and trust of the latest assessment, lumbar change, session in progress and other tasks of the day. Level `nodata` without an assessment.
      parameters:
        - $ref: '#/components/parameters/AstronautId'
      responses:
        '200':
          description: The today view.
          content:
            application/json:
              schema:
                $ref: 'schemas/v1/app/ui-today.schema.json'
        '422':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /ui/crew/{astronaut_id}/views/history:
    get:
      operationId: getHistoryView
      summary: History screen, one row per day
      description: Days of the window, oldest first. Without `from`/`to` the app picks the default window. The window is at most 366 days (`to` - `from` + 1), otherwise `invalid_range`.
      parameters:
        - $ref: '#/components/parameters/AstronautId'
        - $ref: '#/components/parameters/FromDate'
        - $ref: '#/components/parameters/ToDate'
      responses:
        '200':
          description: The history view.
          content:
            application/json:
              schema:
                $ref: 'schemas/v1/app/ui-history.schema.json'
        '422':
          $ref: '#/components/responses/InvalidRange'
        default:
          $ref: '#/components/responses/Error'
  /ui/crew/{astronaut_id}/views/baseline:
    get:
      operationId: getBaselineView
      summary: Baseline screen
      description: Pre-flight reference sessions, recorded and planned, and the active baseline built from them.
      parameters:
        - $ref: '#/components/parameters/AstronautId'
      responses:
        '200':
          description: The baseline view.
          content:
            application/json:
              schema:
                $ref: 'schemas/v1/app/ui-baseline.schema.json'
        '422':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /ui/crew/{astronaut_id}/views/first-day:
    get:
      operationId: getFirstDayView
      summary: First-day screen
      description: Set-up tasks still to do and baseline progress. Carries no name of the astronaut.
      parameters:
        - $ref: '#/components/parameters/AstronautId'
      responses:
        '200':
          description: The first-day view.
          content:
            application/json:
              schema:
                $ref: 'schemas/v1/app/ui-first-day.schema.json'
        '422':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /ui/crew/{astronaut_id}/houston:
    get:
      operationId: getHoustonView
      summary: Houston screen
      description: Latest summary prepared for the ground station, state of the link and last confirmed contact. `summary` is null while the astronaut has nothing yet. The transport is simulated (`transport` is `simulated`) and the content is pending validation by Aguado (`content_validated` is false).
      parameters:
        - $ref: '#/components/parameters/AstronautId'
      responses:
        '200':
          description: The Houston view.
          content:
            application/json:
              schema:
                $ref: 'schemas/v1/app/ui-houston.schema.json'
        '422':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /ui/crew/{astronaut_id}/outbox:
    get:
      operationId: getOutboxView
      summary: Ground outbox
      description: Summaries queued for or sent to the ground station, most recent first, without clinical content. Empty `items` for an astronaut without summaries.
      parameters:
        - $ref: '#/components/parameters/AstronautId'
      responses:
        '200':
          description: The outbox view.
          content:
            application/json:
              schema:
                $ref: 'schemas/v1/app/ui-outbox.schema.json'
        '422':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /ui/sessions/{session_id}:
    get:
      operationId: getStoredSession
      summary: A session as stored
      description: The domain session (with its declared streams), its app state, why it failed if it did, and its feature set once analysed. Served for running, ended, processing, processed and processing_failed sessions; 404 otherwise.
      parameters:
        - $ref: '#/components/parameters/SessionId'
      responses:
        '200':
          description: The session.
          content:
            application/json:
              schema:
                type: object
                required: [session, state, error, feature_set]
                properties:
                  session:
                    $ref: 'schemas/v1/domain/session.schema.json'
                  state:
                    $ref: 'schemas/v1/app/ui-common.schema.json#/$defs/session_state'
                  error:
                    type: [string, 'null']
                  feature_set:
                    oneOf:
                      - $ref: 'schemas/v1/domain/feature-set.schema.json'
                      - type: 'null'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /ui/sessions/{session_id}/view:
    get:
      operationId: getSessionView
      summary: Guided session screen
      description: Protocol facts, step progress, sensor checks and calibration of one session.
      parameters:
        - $ref: '#/components/parameters/SessionId'
      responses:
        '200':
          description: The session view.
          content:
            application/json:
              schema:
                $ref: 'schemas/v1/app/ui-session.schema.json'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /ui/sessions/{session_id}/reps:
    get:
      operationId: streamRepState
      summary: Live repetition counter
      description: Server-sent events with the live repetition counter of one session, derived from its imu_l3 stream.
      parameters:
        - $ref: '#/components/parameters/SessionId'
      responses:
        '200':
          description: |
            Server-sent events stream (`text/event-stream`). Each event `data:` is one JSON `RepStateView`
            (`schemas/v1/app/ui-rep-state.schema.json`). `event: state` is sent when the client connects
            and at every change of the state. `event: end` is sent when the session ends: its `data:` is
            the last `RepStateView` and the server then closes the stream. For a session that has already
            ended the stream is a final `state` followed by `end`. In a session that is over, both the final
            `state` and `end` have `signal: ok` and null `phase` and `progress_pct`, and keep `rep` and `last`:
            the end of a session is not a loss of the sensor.
          content:
            text/event-stream:
              schema:
                type: string
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/NoReps'
        '422':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
components:
  parameters:
    AstronautId:
      name: astronaut_id
      in: path
      required: true
      schema:
        $ref: 'schemas/v1/common.schema.json#/$defs/astronaut_id'
    SessionId:
      name: session_id
      in: path
      required: true
      schema:
        $ref: 'schemas/v1/common.schema.json#/$defs/uuid'
    Day:
      name: day
      in: path
      required: true
      description: Calendar day (ISO 8601 date).
      schema:
        $ref: 'schemas/v1/common.schema.json#/$defs/date'
    IfMatch:
      name: If-Match
      in: header
      required: false
      description: ETag from the corresponding GET; update only that version.
      schema:
        type: string
    IfNoneMatch:
      name: If-None-Match
      in: header
      required: false
      description: '`*` stores the body only when nothing is stored yet (412 otherwise). Any other value is a 422.'
      schema:
        type: string
        const: '*'
    DeviceId:
      name: device_id
      in: query
      required: false
      description: Device to describe (the one paired in the app). Omitted, the device that reported last.
      schema:
        $ref: 'schemas/v1/common.schema.json#/$defs/device_id'
    FromDate:
      name: from
      in: query
      required: false
      description: First day of the window, inclusive (ISO 8601 date).
      schema:
        $ref: 'schemas/v1/common.schema.json#/$defs/date'
    ToDate:
      name: to
      in: query
      required: false
      description: Last day of the window, inclusive (ISO 8601 date). Not before `from`, and at most 365 days after it (a window of 366 days), otherwise `invalid_range`.
      schema:
        $ref: 'schemas/v1/common.schema.json#/$defs/date'
  responses:
    Unauthorized:
      description: No valid UI token (problem details; branch on the status, the body type is `invalid_request`).
      content:
        application/problem+json:
          schema:
            $ref: 'schemas/v1/app/error.schema.json'
    Forbidden:
      description: '`X-Astronaut-Id` names another astronaut than the path (problem details; branch on the status).'
      content:
        application/problem+json:
          schema:
            $ref: 'schemas/v1/app/error.schema.json'
    NoData:
      description: Nothing stored yet (problem details, type `not_found`).
      content:
        application/problem+json:
          schema:
            $ref: 'schemas/v1/app/error.schema.json'
    Invalid:
      description: The body does not conform to its schema, or names another astronaut or day than the path (problem details, type `invalid_request`, with `errors[].pointer` into the body).
      content:
        application/problem+json:
          schema:
            $ref: 'schemas/v1/app/error.schema.json'
    AlreadyStored:
      description: 'The create-only condition failed or the If-Match version changed; the stored record was left untouched (problem details).'
      content:
        application/problem+json:
          schema:
            $ref: 'schemas/v1/app/error.schema.json'
    Conflict:
      description: "Refused in the current state (problem details; branch on the status): another active session on the harness, the harness offline, the session not running, or an id already used with other content."
      content:
        application/problem+json:
          schema:
            $ref: 'schemas/v1/app/error.schema.json'
    BusDown:
      description: "The command could not be sent: the bus is down (problem details; branch on the status). Nothing reached the harness."
      content:
        application/problem+json:
          schema:
            $ref: 'schemas/v1/app/error.schema.json'
    NotFound:
      description: The session does not exist (problem details, type `not_found`).
      content:
        application/problem+json:
          schema:
            $ref: 'schemas/v1/app/error.schema.json'
    InvalidRange:
      description: Problem details, type `invalid_range`, or `invalid_request` for a malformed parameter. `invalid_range` when `from` is after `to`, when the window is longer than 366 days (`to` - `from` + 1 > 366) or when a date is out of range.
      content:
        application/problem+json:
          schema:
            $ref: 'schemas/v1/app/error.schema.json'
    NoReps:
      description: Problem details, type `no_reps`. The protocol of the session has no repetitions or the session has no imu_l3 stream.
      content:
        application/problem+json:
          schema:
            $ref: 'schemas/v1/app/error.schema.json'
    Error:
      description: Problem details (invalid parameter, internal error).
      content:
        application/problem+json:
          schema:
            $ref: 'schemas/v1/app/error.schema.json'
