[project]
name = "spine-contracts"
version = "0.1.0"
description = "Asclepius Orbit data contracts: JSON Schemas (source of truth), generated Pydantic models and MQTT topics"
readme = "README.md"
authors = [
    { name = "Oriol Orbea", email = "oriol.orbea@gmail.com" }
]
requires-python = ">=3.14.8,<3.15"
dependencies = [
    "jsonschema[format-nongpl]>=4.26.0",
    "pydantic>=2.14.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/spine_contracts"]

[tool.hatch.build.targets.wheel.force-include]
"schemas/v1" = "spine_contracts/schemas/v1"

[dependency-groups]
dev = [
    "datamodel-code-generator>=0.86.0",
    "pyyaml>=6.0.3",
]
