# On-board broker. Every client authenticates (no anonymous access) and only reaches the topics of its ACL.
# The password file and the ACL are generated by app/mosquitto/setup.sh into app/mosquitto/auth/ (gitignored);
# the compose service copies them to /mosquitto/auth/ (owner mosquitto, mode 0600) before starting.
per_listener_settings false
allow_anonymous false
password_file /mosquitto/auth/passwd
acl_file /mosquitto/auth/acl

# Plain MQTT; compose publishes it only on 127.0.0.1. The LAN listener (TLS, 8883) is in mosquitto-lan.conf.
listener 1883
