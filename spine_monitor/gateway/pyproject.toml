[project]
name = "spine-gateway"
version = "0.1.0"
description = "Real wearable gateway: reads the Arduino over USB serial and publishes MQTT v1 chunks"
authors = [
    { name = "Oriol Orbea", email = "oriol.orbea@gmail.com" }
]
requires-python = ">=3.14.8,<3.15"
dependencies = [
    "aiomqtt>=2.5.1",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.1",
    "pyserial>=3.5",
    "spine-contracts",
]

[project.scripts]
spine-gateway = "spine_gateway.__main__:main"
spine-arduino-emulator = "spine_gateway.emulator:main"

[build-system]
requires = ["uv_build>=0.11.20,<0.12.0"]
build-backend = "uv_build"

[tool.uv.sources]
spine-contracts = { workspace = true }
