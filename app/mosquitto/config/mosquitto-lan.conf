# Same broker plus a TLS listener for the LAN (app/docker-compose.lan.yml). Certificates come from
# SPINE_MQTT_TLS_DIR (mounted read-only on /mosquitto-certs and copied to /mosquitto/certs); none is ever committed.
per_listener_settings false
allow_anonymous false
password_file /mosquitto/auth/passwd
acl_file /mosquitto/auth/acl

listener 1883

listener 8883
cafile /mosquitto/certs/ca.crt
certfile /mosquitto/certs/server.crt
keyfile /mosquitto/certs/server.key
tls_version tlsv1.2
