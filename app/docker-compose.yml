services:
  mosquitto:
    image: eclipse-mosquitto:2.0.22
    ports:
      - "127.0.0.1:1883:1883"
    volumes:
      - ./mosquitto/config:/mosquitto/config
      - ./mosquitto/data:/mosquitto/data
    restart: unless-stopped

  engine:
    build:
      context: ..
      dockerfile: spine_monitor/engine/Dockerfile
    image: spine-engine:dev
    ports:
      - "127.0.0.1:8001:8001"
    restart: unless-stopped

  backend:
    build:
      context: ..
      dockerfile: spine_monitor/backend/Dockerfile
    image: spine-backend:dev
    environment:
      MQTT_HOST: mosquitto
      MQTT_PORT: "1883"
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      - mosquitto
    restart: unless-stopped

  simulator:
    build:
      context: ..
      dockerfile: spine_monitor/physiology/Dockerfile
    image: spine-simulator:dev
    environment:
      SPINE_SIM_CONFIG: /app/configs/example-mission.yaml
      SPINE_SIM_MQTT_HOST: mosquitto
      SPINE_SIM_MQTT_PORT: "1883"
      SPINE_SIM_SPEED: "1"
      SPINE_SIM_START_DAY: "0"
    depends_on:
      - mosquitto
    profiles: ["sim"]
    restart: unless-stopped
