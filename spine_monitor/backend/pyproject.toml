[project]
name = "spine-backend"
version = "0.1.0"
description = "Backend: ingests MQTT telemetry and exposes the monitor API"
requires-python = ">=3.14.8,<3.15"
dependencies = [
    "aiomqtt>=2.5.1",
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "matplotlib>=3.11.2",
    "pydantic-settings>=2.16.1",
    "reportlab>=5.1.0",
    "spine-contracts",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.11.20,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "monitor"

[tool.uv.sources]
spine-contracts = { workspace = true }
