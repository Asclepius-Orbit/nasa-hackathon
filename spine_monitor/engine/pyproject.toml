[project]
name = "spine-engine"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Oriol Orbea", email = "oriol.orbea@gmail.com" }
]
requires-python = ">=3.14.8,<3.15"
dependencies = [
    "fastapi>=0.162.0",
    "numpy>=2.5.4",
    "pydantic-settings>=2.16.1",
    "spine-contracts",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
spine-engine = "spine_engine.api.__main__:main"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "spine-physiology",
]

[build-system]
requires = ["uv_build>=0.11.20,<0.12.0"]
build-backend = "uv_build"

[tool.uv.sources]
spine-contracts = { workspace = true }
spine-physiology = { workspace = true }
